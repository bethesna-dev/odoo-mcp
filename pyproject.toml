[project]
name = "odoo-mcp"
version = "0.1.0"
description = "Solidum Odoo connector: MCP server for Odoo over XML-RPC (Cursor marketplace plugin)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2.2,<3"]

[project.scripts]
odoo-mcp = "odoo_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
